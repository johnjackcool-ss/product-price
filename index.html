<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>嘉華龍鳳板查價系統</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:'Microsoft JhengHei',sans-serif;color:#172033}.app{max-width:480px;margin:auto;padding:16px}.hero,.result{background:#111827;color:#fff;border-radius:24px;padding:18px}.hero{background:linear-gradient(135deg,#7c2d12,#b45309)}h1{margin:4px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:15px;margin-top:14px}.tabs,.row2,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button.active{background:#111827;color:#fff}input,select,button{width:100%;border-radius:14px;font-family:inherit}input,select{padding:13px;border:1px solid #cbd5e1;background:#fff}input{font-size:23px;font-weight:900}button{border:0;padding:12px;font-weight:800;background:#e2e8f0}.primary{background:#7c2d12;color:#fff}.status{margin-top:10px;padding:10px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:13px}.empty{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:#64748b}.code{font-size:32px;font-weight:900}.name{font-size:23px;font-weight:900;margin-top:4px}.imgwrap{margin-top:12px;background:#fff;border-radius:17px;overflow:hidden}.imgwrap img{display:block;width:100%;max-height:380px;object-fit:contain}.material{margin-top:11px;background:#fff;color:#172033;border-radius:17px;padding:13px}.material h3{margin:0 0 8px}.price{display:flex;justify-content:space-between;padding:9px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;margin-top:6px}.price b{font-size:19px}.hidden{display:none}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:99;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal img{max-width:100%;max-height:90vh}.note{font-size:12px;color:#cbd5e1;margin-top:10px;line-height:1.6}</style></head><body>
<div class="app"><section class="hero"><small>嘉華龍鳳板｜公司查價系統 V2</small><h1>商品價格查詢</h1><div>圖片、材質、通路價格、下載與分享一次完成。</div></section>
<section class="card"><div class="tabs"><button id="customer" class="active">客戶模式</button><button id="company">公司模式</button></div><div id="tierBox" style="margin-top:10px"><label>客戶模式顯示價位</label><select id="tier"><option>中盤價格</option><option selected>建材價格</option><option>師傅價格</option></select></div><label style="display:block;margin-top:10px">商品編號</label><input id="code" placeholder="例如：6001"><div class="row2" style="margin-top:10px"><button id="refresh" class="primary">更新試算表</button><button id="clear">清除</button></div><div id="status" class="status">正在讀取資料……</div></section>
<section class="card"><div id="box" class="empty">請先輸入商品編號</div></section></div>
<div id="modal" class="modal" onclick="this.classList.remove('show')"><img id="modalImg"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyXLK6XjsYJf1xxChAvv4bJDMp8_NGOaBkG9cKQKYo_F2JgbeKQTVR8TtmJR87UGB9yJQ/exec';let data=[],mode='customer';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
async function load(show=false){$('status').textContent='正在讀取資料……';try{const r=await fetch(API+'?t='+Date.now());const j=await r.json();if(!j.success)throw 0;data=j.data||[];localStorage.setItem('jh_v2',JSON.stringify(data));$('status').textContent=`已更新，共 ${data.length} 筆資料`;render();if(show)alert('資料已更新')}catch(e){const c=localStorage.getItem('jh_v2');if(c){data=JSON.parse(c);$('status').textContent='目前使用上次下載的資料';render()}else $('status').textContent='無法讀取資料，請檢查 Apps Script 權限'}}
function money(v){if(v===undefined||v===null||String(v).trim()==='')return '未設定';const n=Number(String(v).replaceAll(',',''));return Number.isNaN(n)?esc(v):n.toLocaleString('zh-TW')+' 元'}
function matches(code){return data.filter(x=>String(x['商品編號']??'').trim().toUpperCase()===code)}
function render(){const code=$('code').value.trim().toUpperCase();if(!code){$('box').className='empty';$('box').innerHTML='請先輸入商品編號';return}const ms=matches(code);if(!ms.length){$('box').className='empty';$('box').innerHTML='查無商品編號：'+esc(code);return}const name=ms[0]['商品名稱']||'',img=`images/${encodeURIComponent(code)}.jpg`,tier=$('tier').value;let cards=ms.map(x=>{if(mode==='customer')return `<div class="material"><h3>${esc(x['類別']||'未分類')}</h3><div class="price"><span>${tier.replace('價格','')}</span><b>${money(x[tier])}</b></div></div>`;return `<div class="material"><h3>${esc(x['類別']||'未分類')}</h3><div class="price"><span>中盤價格</span><b>${money(x['中盤價格'])}</b></div><div class="price"><span>建材價格</span><b>${money(x['建材價格'])}</b></div><div class="price"><span>師傅價格</span><b>${money(x['師傅價格'])}</b></div></div>`}).join('');$('box').className='';$('box').innerHTML=`<div class="result"><small>商品編號</small><div class="code">${esc(code)}</div><div class="name">${esc(name)}</div><div id="iw" class="imgwrap"><img src="${img}" onclick="zoom(this.src)" onerror="$('iw').style.display='none'"></div><div class="actions" style="margin-top:9px"><button onclick="downloadImg('${img}','${esc(code)}.jpg')">下載圖片</button><button onclick="shareImg('${img}','${esc(code)}','${esc(name)}')">分享圖片</button></div>${cards}<div class="actions" style="margin-top:10px"><button onclick="copyReply('${esc(code)}')">複製客服回覆</button><button onclick="shareText('${esc(code)}')">分享商品文字</button></div><div class="note">客戶模式只顯示所選價位；公司模式顯示完整中盤、建材及師傅價格。</div></div>`}
function reply(code){const ms=matches(code),name=ms[0]['商品名稱']||'',a=[`您好，${code} ${name}`];if(mode==='customer'){const t=$('tier').value;ms.forEach(x=>{if(x[t])a.push(`${x['類別']}：${x[t]} 元`)})}else ms.forEach(x=>{a.push('',`【${x['類別']}】`);['中盤價格','建材價格','師傅價格'].forEach(t=>{if(x[t])a.push(`${t}：${x[t]} 元`)})});a.push('','有需要我再幫您安排出貨，謝謝。');return a.join('\n')}
async function copyReply(c){await navigator.clipboard.writeText(reply(c));alert('客服回覆已複製')}async function shareText(c){const text=reply(c);if(navigator.share)await navigator.share({title:'嘉華龍鳳板商品資訊',text});else{await navigator.clipboard.writeText(text);alert('內容已複製')}}
async function downloadImg(u,n){try{const r=await fetch(u),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}catch(e){open(u)}}async function shareImg(u,c,n){try{const r=await fetch(u),b=await r.blob(),f=new File([b],c+'.jpg',{type:b.type||'image/jpeg'});if(navigator.canShare?.({files:[f]}))await navigator.share({title:c+' '+n,files:[f]});else if(navigator.share)await navigator.share({title:c+' '+n,url:new URL(u,location.href).href});else open(u)}catch(e){open(u)}}function zoom(s){$('modalImg').src=s;$('modal').classList.add('show')}
$('customer').onclick=()=>{mode='customer';$('customer').classList.add('active');$('company').classList.remove('active');$('tierBox').classList.remove('hidden');render()};$('company').onclick=()=>{mode='company';$('company').classList.add('active');$('customer').classList.remove('active');$('tierBox').classList.add('hidden');render()};const savedTier=localStorage.getItem('jh_price_tier')||'建材價格';
$('tier').value=savedTier;
$('code').oninput=render;
$('tier').onchange=()=>{localStorage.setItem('jh_price_tier',$('tier').value);render()};$('refresh').onclick=()=>load(true);$('clear').onclick=()=>{$('code').value='';render()};load();
</script></body></html>
