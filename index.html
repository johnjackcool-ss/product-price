<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>商品價格查詢</title>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--dark:#0f172a;--dark2:#334155;--soft:#f8fafc;
  --ok:#166534;--warn:#92400e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:470px;margin:auto;min-height:100vh;padding:16px 16px 32px}
.hero{
  padding:20px;border-radius:28px;color:#fff;
  background:linear-gradient(135deg,var(--dark),var(--dark2));
  box-shadow:0 8px 24px rgba(15,23,42,.18)
}
.hero h1,.hero p{margin:0}
.hero h1{font-size:28px;margin-top:5px}
.hero .small{font-size:13px;opacity:.82}
.hero .desc{margin-top:10px;font-size:14px;line-height:1.8;color:#e2e8f0}
.card{
  margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);
  border-radius:28px;box-shadow:0 2px 8px rgba(15,23,42,.04)
}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:800;color:var(--muted)}
input,button{width:100%;font-family:inherit;border-radius:18px;outline:none}
input{
  padding:16px;border:1px solid #cbd5e1;font-size:24px;font-weight:900;
  letter-spacing:.03em;background:#fff
}
.buttons{display:flex;gap:10px;margin-top:12px}
button{border:0;padding:13px;font-size:15px;font-weight:800;cursor:pointer;background:#e2e8f0;color:var(--text)}
.primary{background:var(--dark);color:white}
.status{
  margin-top:12px;padding:12px;border-radius:16px;font-size:13px;line-height:1.6;
  background:var(--soft);border:1px solid var(--line);color:var(--muted)
}
.status.ok{background:#f0fdf4;border-color:#bbf7d0;color:var(--ok)}
.status.warn{background:#fffbeb;border-color:#fde68a;color:var(--warn)}
.empty{
  min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px dashed #cbd5e1;border-radius:24px;color:var(--muted);
  background:var(--soft);padding:24px;line-height:1.8
}
.result{border-radius:24px;padding:18px;background:var(--dark);color:white}
.code{font-size:34px;font-weight:900}
.name{
  margin-top:10px;padding:14px;border-radius:18px;background:rgba(255,255,255,.1);
  font-size:25px;font-weight:900;line-height:1.35
}
.material{
  margin-top:12px;padding:14px;background:#fff;color:var(--text);border-radius:20px
}
.material-title{font-size:20px;font-weight:900;margin-bottom:10px}
.price-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 12px;border-radius:14px;background:#f8fafc;
  border:1px solid #e2e8f0;margin-top:8px
}
.price-label{font-size:15px;font-weight:800;color:#475569}
.price{font-size:22px;font-weight:900}
.copy-btn{margin-top:12px;background:#e2e8f0}
.small-note{margin-top:10px;color:#cbd5e1;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <p class="small">Google 試算表正式同步版</p>
    <h1>商品價格查詢</h1>
    <p class="desc">輸入商品編號，查看各類別的中盤、建材及師傅價格。</p>
  </section>

  <section class="card">
    <label for="codeInput">商品編號</label>
    <input id="codeInput" type="text" inputmode="numeric" placeholder="例如：6001" autocomplete="off">
    <div class="buttons">
      <button id="refreshBtn" class="primary">更新試算表資料</button>
      <button id="clearBtn">清除</button>
    </div>
    <div id="status" class="status">正在連接試算表……</div>
  </section>

  <section class="card">
    <div id="resultBox" class="empty">請先輸入商品編號</div>
  </section>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyXLK6XjsYJf1xxChAvv4bJDMp8_NGOaBkG9cKQKYo_F2JgbeKQTVR8TtmJR87UGB9yJQ/exec";
const CACHE_KEY = "jiahu_product_api_cache_v1";

const codeInput = document.getElementById("codeInput");
const resultBox = document.getElementById("resultBox");
const statusBox = document.getElementById("status");
let rows = [];

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  if(value === undefined || value === null || String(value).trim() === "") return "未設定";
  const clean = String(value).replace(/,/g,"").trim();
  const num = Number(clean);
  return Number.isNaN(num) ? esc(value) : "NT$ " + num.toLocaleString("zh-TW");
}

function normalizeRows(data){
  if(!Array.isArray(data)) return [];
  return data.filter(item => item && String(item["商品編號"] ?? "").trim() !== "");
}

async function loadData(showAlert=false){
  statusBox.className = "status";
  statusBox.textContent = "正在讀取 Google 試算表……";

  try{
    const response = await fetch(API_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);

    const json = await response.json();
    if(!json.success) throw new Error(json.message || "讀取失敗");

    rows = normalizeRows(json.data);
    if(!rows.length) throw new Error("沒有商品資料");

    localStorage.setItem(CACHE_KEY, JSON.stringify(rows));
    statusBox.className = "status ok";
    statusBox.textContent = `已更新，共讀取 ${rows.length} 筆價格資料。`;
    renderResult();

    if(showAlert) alert("試算表資料已更新");
  }catch(error){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      try{
        rows = JSON.parse(cached);
        statusBox.className = "status warn";
        statusBox.textContent = "目前無法連線，暫時使用上一次成功下載的資料。";
        renderResult();
        return;
      }catch(_){}
    }

    statusBox.className = "status warn";
    statusBox.textContent = "無法讀取資料。請確認 Apps Script 部署權限選擇「任何人」。";
    resultBox.className = "empty";
    resultBox.innerHTML = "尚未取得商品資料";
  }
}

function renderResult(){
  const code = codeInput.value.trim().toUpperCase();

  if(!code){
    resultBox.className = "empty";
    resultBox.innerHTML = "請先輸入商品編號";
    return;
  }

  const matches = rows.filter(row =>
    String(row["商品編號"] ?? "").trim().toUpperCase() === code
  );

  if(!matches.length){
    resultBox.className = "empty";
    resultBox.innerHTML = `<div><strong style="font-size:26px;color:#0f172a">查無 ${esc(code)}</strong><br>請確認商品編號是否正確。</div>`;
    return;
  }

  const productName = matches[0]["商品名稱"] || "";
  const materials = matches.map(row => `
    <div class="material">
      <div class="material-title">${esc(row["類別"] || "未分類")}</div>
      <div class="price-row">
        <span class="price-label">中盤價格</span>
        <span class="price">${money(row["中盤價格"])}</span>
      </div>
      <div class="price-row">
        <span class="price-label">建材價格</span>
        <span class="price">${money(row["建材價格"])}</span>
      </div>
      <div class="price-row">
        <span class="price-label">師傅價格</span>
        <span class="price">${money(row["師傅價格"])}</span>
      </div>
    </div>
  `).join("");

  resultBox.className = "";
  resultBox.innerHTML = `
    <div class="result">
      <div style="font-size:13px;color:#cbd5e1">商品編號</div>
      <div class="code">${esc(code)}</div>
      <div class="name">${esc(productName)}</div>
      ${materials}
      <button class="copy-btn" onclick="copyQuote('${esc(code)}')">複製全部價格</button>
      <div class="small-note">修改試算表後，按「更新試算表資料」即可同步。</div>
    </div>
  `;
}

function copyQuote(code){
  const matches = rows.filter(row =>
    String(row["商品編號"] ?? "").trim().toUpperCase() === code
  );
  if(!matches.length) return;

  const lines = [`${code} ${matches[0]["商品名稱"] || ""}`];

  matches.forEach(row => {
    lines.push("");
    lines.push(`【${row["類別"] || "未分類"}】`);
    if(row["中盤價格"]) lines.push(`中盤價格：${row["中盤價格"]}元`);
    if(row["建材價格"]) lines.push(`建材價格：${row["建材價格"]}元`);
    if(row["師傅價格"]) lines.push(`師傅價格：${row["師傅價格"]}元`);
  });

  navigator.clipboard.writeText(lines.join("\n"))
    .then(() => alert("已複製全部價格"))
    .catch(() => alert("複製失敗，請長按畫面文字複製"));
}

codeInput.addEventListener("input", renderResult);
document.getElementById("refreshBtn").addEventListener("click", () => loadData(true));
document.getElementById("clearBtn").addEventListener("click", () => {
  codeInput.value = "";
  renderResult();
  codeInput.focus();
});

loadData(false);
</script>
</body>
</html>
